version: '3.8'

services:
  oceanview4d:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=8080
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - oceanview4d
    restart: unless-stopped
